[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "curlcast"
# Single source of truth: src/curlcast/__init__.py:__version__
dynamic = ["version"]
description = "Render photos, GIFs, and videos in crisp terminal art with synced audio."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CurlCast Contributors" }]
keywords = ["terminal", "ascii-art", "video", "cli", "image", "animation", "truecolor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Terminals",
    "Typing :: Typed",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "imageio-ffmpeg>=0.4.9",
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.8",
    "ruff>=0.5",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
curlcast = "curlcast.cli:main"

[project.urls]
Homepage = "https://github.com/VutukuriEswar/CurlCast"
Repository = "https://github.com/VutukuriEswar/CurlCast"
"Bug Tracker" = "https://github.com/VutukuriEswar/CurlCast/issues"

[tool.hatch.version]
path = "src/curlcast/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/curlcast"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer options are intentionally constructed in parameter defaults.
"src/curlcast/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
